[package]
name = "ferrum-indexer"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "FerrumIndexer Windows service (FER-474 skeleton + IPC, FER-475 MFT/USN index) and the authenticated named-pipe protocol shared with Ferrum"

# This crate runs as LocalSystem inside ferrum-indexer.exe, so its surface must
# stay small and reviewable: no serde, no async runtime, no network.
# - windows-sys (Microsoft, MIT/Apache-2.0): the Win32 calls.
# - windows-service (Mullvad, MIT/Apache-2.0, depends only on windows-sys,
#   bitflags, widestring): SCM dispatcher, control handler, service config.
# FER-475 (index):
# - ferrum-ntfs-scan (ours, FER-460): the hardened MFT parser, reused, never
#   duplicated. Feature "fixture" exports its synthetic-MFT builder for this
#   crate's tests: this crate is not a workspace member, and cargo refuses to
#   test non-members that have dev-dependencies. The builder is pure byte
#   assembly, never called outside tests (dead code in every binary; via
#   feature unification it is also compiled into Ferrum and the helper).
# - flate2 (rust-lang, pure-Rust miniz_oxide backend) + crc32fast: compressed,
#   checksummed index files. Both were already in Cargo.lock (zip).
[dependencies]
ferrum-ntfs-scan = { path = "../ntfs-scan", features = ["fixture"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Wdk_System_SystemInformation",
] }
