name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Windows Gate
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master as of 2026-10-14
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/indexer

      - name: Install npm dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npx prettier --check .

      - name: Run ESLint
        run: npm run lint

      - name: Svelte type check
        run: npx svelte-check --threshold error

      - name: Run Vitest
        run: npx vitest run

      - name: Build frontend
        run: npm run build

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Cargo clippy (workspace)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test (workspace)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Cargo clippy (indexer crate)
        working-directory: src-tauri/crates/indexer
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test (indexer crate)
        working-directory: src-tauri/crates/indexer
        run: cargo test

  e2e:
    name: Playwright E2E (Optional)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
