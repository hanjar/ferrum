name: Installer Smoke

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/windows/**'
      - 'scripts/installer-smoke.ps1'
      - '.github/workflows/installer-smoke.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: NSIS install / upgrade / uninstall
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master as of 2026-10-14
        with:
          toolchain: 1.98.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri
            src-tauri/crates/indexer

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer A (version in repo)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $a = $conf.version
          "VERSION_A=$a" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build (A) failed" }
          New-Item -ItemType Directory -Force installers/a | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe installers/a/
          Get-ChildItem installers/a

      - name: Build installer B (patch version + 1, runner only)
        shell: pwsh
        run: |
          $a = [version]$env:VERSION_A
          $b = '{0}.{1}.{2}' -f $a.Major, $a.Minor, ($a.Build + 1)
          "VERSION_B=$b" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # tauri.conf.json is the source of truth for the installer; keep Cargo.toml in step.
          $confPath = 'src-tauri/tauri.conf.json'
          $c = Get-Content $confPath -Raw
          $c = $c -replace '"version":\s*"[^"]+"', ('"version": "' + $b + '"')
          Set-Content -Path $confPath -Value $c -NoNewline -Encoding utf8
          $cargoPath = 'src-tauri/Cargo.toml'
          $t = Get-Content $cargoPath -Raw
          $t = [regex]::Replace($t, '(?m)^version = "[^"]+"', ('version = "' + $b + '"'), 1)
          Set-Content -Path $cargoPath -Value $t -NoNewline -Encoding utf8
          git diff --stat
          Remove-Item src-tauri/target/release/bundle/nsis -Recurse -Force
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build (B) failed" }
          New-Item -ItemType Directory -Force installers/b | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe installers/b/
          Get-ChildItem installers/b

      - name: Install / run / upgrade / uninstall smoke
        shell: pwsh
        run: |
          $ia = (Get-ChildItem installers/a/*.exe | Select-Object -First 1).FullName
          $ib = (Get-ChildItem installers/b/*.exe | Select-Object -First 1).FullName
          ./scripts/installer-smoke.ps1 -InstallerA $ia -InstallerB $ib `
            -VersionA $env:VERSION_A -VersionB $env:VERSION_B -LogDir installer-smoke-logs

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-smoke-logs
          path: installer-smoke-logs
          if-no-files-found: warn
